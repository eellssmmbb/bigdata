version: '3.8'

services:
  db:
    image: postgres:14
    container_name: forum_db
    environment:
      POSTGRES_DB: forumdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - forum_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    restart: always

volumes:
  forum_db_data:
