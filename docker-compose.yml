version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: forum_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forum_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3307:3306" # Правильный формат проброса портов
    volumes:
      - mysql_data:/var/lib/mysql  # Только имя тома здесь
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:  # Определение тома здесь