version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: forum_mysql
    environment:
      MYSQL_DATABASE: forum_logs
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
